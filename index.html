<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WormWorx Wasm</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #details {
            position: absolute;
            top: 10px;
            left: 10px;
            color: purple;
            z-index: 1000;
            font-family: monospace;
            opacity: 0.8;
            line-height: 1.5;
        }
        #details p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="details">
        <p>Salt stimulus: <span id="saltStimulus">0.0</span></p>
        <p>Salt stimulus multiplier: <span id="saltStimulusMultiplier">1.0</span></p>
    </div>
    <canvas id="wormCanvas"></canvas>
    <script src="wormworx.js"></script>
    <script>
        createWormWorxModule().then(function(Module) {
            const canvas = document.getElementById('wormCanvas');
            const ctx = canvas.getContext('2d');

            const worm = new Module.WormWorx();
            let salt_stimulus = 0.0;
            let mouseDistance = 0;
            let mouseX = 0;
            let mouseY = 0;
            let _scale = 100000;
            let cameraX = 0; // Camera offset X
            let cameraY = 0; // Camera offset Y
            let saltTimeout = null;
            let saltStimulusMultiplier = 1.0;

            // Function to resize the canvas
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                // You might need to redraw or reinitialize things here if needed
                // For now, the updateAndDraw loop will handle redrawing
            }

            // Initial resize
            resizeCanvas();

            // Add resize listener
            window.addEventListener('resize', resizeCanvas);

            canvas.addEventListener('mousemove', function(event) {
                const rect = canvas.getBoundingClientRect(); // rect is now {0, 0, width, height} due to CSS
                mouseX = event.clientX; // No need for rect.left offset
                mouseY = event.clientY; // No need for rect.top offset
            });

            function distance(x1, y1, x2, y2) {
                return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            }

            function drawWorm(body) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'green';
                ctx.save();
                // translate canvas to center, adjusted by camera offset
                ctx.translate(canvas.width / 2 - cameraX * _scale, canvas.height / 2 - cameraY * _scale);
                // scale canvas to fit the worm (0.0001, 0.0001)
                ctx.scale(_scale, _scale);

                for (let i = 0; i < body.size(); i += 3) {
                    ctx.beginPath();
                    ctx.arc(body.get(i), body.get(i + 1), (1.0 / _scale) * 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            function updateAndDraw() {
                const body = worm.getBody();
                const bx = body.get(0);
                const by = body.get(1);

                const scale = 1.0 / _scale; // Adjust scale to match the canvas scaling
                const viewWidth = canvas.width * scale;
                const viewHeight = canvas.height * scale;

                saltStimulusMultiplier += 0.01;
                saltStimulusMultiplier = Math.min(saltStimulusMultiplier, 1.0);
                
                // Check boundaries and update camera offset
                if (bx > cameraX + viewWidth / 2) { cameraX = bx - viewWidth / 2; saltStimulusMultiplier *= 0.9; }
                if (bx < cameraX - viewWidth / 2) { cameraX = bx + viewWidth / 2; saltStimulusMultiplier *= 0.9; }
                if (by > cameraY + viewHeight / 2) { cameraY = by - viewHeight / 2; saltStimulusMultiplier *= 0.9; }
                if (by < cameraY - viewHeight / 2) { cameraY = by + viewHeight / 2; saltStimulusMultiplier *= 0.9; }


                // Calculate mouse position in world coordinates
                const mouseWorldX = (mouseX - canvas.width / 2) * scale + cameraX;
                const mouseWorldY = (mouseY - canvas.height / 2) * scale + cameraY;

                // Calculate salt stimulus based on world coordinates
                // Assuming simulation's Y increases upwards, while canvas Y increases downwards
                salt_stimulus = (1 / distance(bx, by, mouseWorldX, mouseWorldY)) * scale * saltStimulusMultiplier; 

                document.getElementById('saltStimulus').innerText = salt_stimulus.toFixed(6);
                document.getElementById('saltStimulusMultiplier').innerText = saltStimulusMultiplier.toFixed(2);

                worm.step(salt_stimulus);
                drawWorm(body);

                requestAnimationFrame(updateAndDraw);
            }
            
            updateAndDraw();
        });
    </script>
</body>
</html>
