<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WormWorx Wasm</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #details {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: purple;
            z-index: 1000;
            font-family: monospace;
            opacity: 0.8;
            line-height: 1.5;
            display: none;
        }
        #details p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="details">
        <p>Salt stimulus: <span id="saltStimulus">0.0</span></p>
        <p>Salt stimulus multiplier: <span id="saltStimulusMultiplier">1.0</span></p>
    </div>
    <canvas id="canvas"></canvas>
    <script src="wormworx.js"></script>
    <script>
        createWormWorxModule().then(function(Module) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // Check if debug parameter is present in URL
            const urlParams = new URLSearchParams(window.location.search);
            const debugMode = urlParams.has('debug');
            
            // Hide details panel if not in debug mode
            if (debugMode) {
                document.getElementById('details').style.display = 'block';
            }

            const worm = new Module.WormWorx();
            let salt_stimulus = 0.0;
            let mouseDistance = 0;
            let mouseX = 0;
            let mouseY = 0;
            let _scale = 100000;
            let cameraX = 0;
            let cameraY = 0;
            let saltTimeout = null;
            let saltStimulusMultiplier = 1.0;

            const steeringWeightNames = ['ASEL0', 'ASEL1', 'ASER0', 'ASER1', 'AIYL0', 'AIYR0', 'AIZL0', 'AIZL1', 'AIZR0', 'AIZR1'];
            const steeringActivationNames = ['ASEL', 'ASER', 'AIYL', 'AIYR', 'AIZL', 'AIZR', 'SMBD', 'SMBV'];

            setRandomWeights(worm);

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            canvas.addEventListener('mousemove', function(event) {
                const rect = canvas.getBoundingClientRect();
                mouseX = event.clientX;
                mouseY = event.clientY;
            });

            canvas.addEventListener('click', function(event) {
                setRandomWeights(worm);
            });

            function distance(x1, y1, x2, y2) {
                return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            }

            function drawWorm(body) {
                ctx.fillStyle = 'green';
                ctx.save();
                ctx.translate(canvas.width / 2 - cameraX * _scale, canvas.height / 2 - cameraY * _scale);
                ctx.scale(_scale, _scale);

                for (let i = 0; i < body.size(); i += 3) {
                    ctx.beginPath();
                    ctx.arc(body.get(i), body.get(i + 1), (1.0 / _scale) * 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            function drawBoundary(minX, maxX, minY, maxY) {
                ctx.save();
                ctx.translate(canvas.width / 2 - cameraX * _scale, canvas.height / 2 - cameraY * _scale);
                ctx.scale(_scale, _scale);
                
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.lineWidth = 5 / _scale;
                ctx.beginPath();
                ctx.rect(minX, minY, maxX - minX, maxY - minY);
                ctx.stroke();
                
                ctx.restore();
            }

            function drawNeurons() {
                // Get neuron activations
                const steeringActivations = worm.getSteeringActivations();
                const dorsalMotorActivations = worm.getDorsalMotorActivations();
                const ventralMotorActivations = worm.getVentralMotorActivations();

                // Draw steering neurons
                const startX = 50;
                const startY = 50;
                const spacing = 40;
                const neuronSize = 20;

                ctx.font = '12px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';

                // Draw steering neurons
                for (let i = 0; i < steeringActivations.size(); i++) {
                    const activation = steeringActivations.get(i);
                    const y = startY + i * spacing;
                    
                    // Draw neuron name
                    ctx.fillStyle = 'black';
                    ctx.fillText(steeringActivationNames[i], startX - 10, y);

                    // Draw neuron circle
                    ctx.beginPath();
                    ctx.arc(startX + neuronSize, y, neuronSize, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 0, 255, ${activation})`;
                    ctx.fill();
                    ctx.strokeStyle = 'black';
                    ctx.stroke();

                    // Draw activation value
                    ctx.fillStyle = 'black';
                    ctx.textAlign = 'left';
                    ctx.fillText(activation.toFixed(2), startX + neuronSize * 2 + 10, y);
                    ctx.textAlign = 'right';
                }

                // Draw motor neurons
                const motorStartX = 250;
                const motorStartY = 50;
                const motorSpacing = 20;

                // Draw dorsal motor neurons
                ctx.fillStyle = 'black';
                ctx.textAlign = 'center';
                ctx.fillText('Dorsal Motor Neurons', motorStartX + 100, motorStartY - 20);

                for (let i = 0; i < dorsalMotorActivations.size(); i++) {
                    const activation = dorsalMotorActivations.get(i);
                    const x = motorStartX + (i % 12) * motorSpacing;
                    const y = motorStartY + Math.floor(i / 12) * motorSpacing;

                    ctx.beginPath();
                    ctx.arc(x, y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 0, 0, ${activation})`;
                    ctx.fill();
                    ctx.strokeStyle = 'black';
                    ctx.stroke();
                }

                // Draw ventral motor neurons
                ctx.fillStyle = 'black';
                ctx.fillText('Ventral Motor Neurons', motorStartX + 100, motorStartY + 100);

                for (let i = 0; i < ventralMotorActivations.size(); i++) {
                    const activation = ventralMotorActivations.get(i);
                    const x = motorStartX + (i % 12) * motorSpacing;
                    const y = motorStartY + 120 + Math.floor(i / 12) * motorSpacing;

                    ctx.beginPath();
                    ctx.arc(x, y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 0, ${activation})`;
                    ctx.fill();
                    ctx.strokeStyle = 'black';
                    ctx.stroke();
                }
            }

            function setRandomWeights(_worm) {
                let weights = null;
                try {
                    weights = new Module.VectorDouble();
                    for (let i = 0; i < steeringWeightNames.length; i++) {
                        weights.push_back(Math.random());
                    }
                    _worm.setSteeringSynapseWeights(weights);
                } catch (e) {
                    console.error("Error setting weights:", e);
                } finally {
                    // Always clean up the vector to prevent memory leaks
                    if (weights) {
                        weights.delete();
                        weights = null;
                    }
                }
            }

            function updateAndDraw() {
                const body = worm.getBody();
                const bx = body.get(0);
                const by = body.get(1);

                const scale = 1.0 / _scale;
                const viewWidth = canvas.width * scale;
                const viewHeight = canvas.height * scale;
                
                // Set screen boundaries for collision detection
                const screenMinX = cameraX - viewWidth / 2;
                const screenMaxX = cameraX + viewWidth / 2;
                const screenMinY = cameraY - viewHeight / 2;
                const screenMaxY = cameraY + viewHeight / 2;
                worm.setScreenBoundaries(screenMinX, screenMaxX, screenMinY, screenMaxY);

                saltStimulusMultiplier -= 0.01;
                saltStimulusMultiplier = Math.min(Math.max(saltStimulusMultiplier, 1), 10);
                
                if (bx > cameraX + viewWidth / 2) { cameraX = bx - viewWidth / 2; saltStimulusMultiplier *= 1.1; }
                if (bx < cameraX - viewWidth / 2) { cameraX = bx + viewWidth / 2; saltStimulusMultiplier *= 1.1; }
                if (by > cameraY + viewHeight / 2) { cameraY = by - viewHeight / 2; saltStimulusMultiplier *= 1.1; }
                if (by < cameraY - viewHeight / 2) { cameraY = by + viewHeight / 2; saltStimulusMultiplier *= 1.1; }

                const mouseWorldX = (mouseX - canvas.width / 2) * scale + cameraX;
                const mouseWorldY = (mouseY - canvas.height / 2) * scale + cameraY;

                salt_stimulus = distance(bx, by, mouseWorldX, mouseWorldY) * saltStimulusMultiplier;

                if (debugMode) {
                    document.getElementById('saltStimulus').innerText = salt_stimulus.toFixed(6);
                    document.getElementById('saltStimulusMultiplier').innerText = saltStimulusMultiplier.toFixed(2);
                }

                worm.step(salt_stimulus);
                
                // Clear the entire canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw worm
                drawWorm(body);
                
                // Only draw boundary in debug mode
                if (debugMode) {
                    drawBoundary(screenMinX, screenMaxX, screenMinY, screenMaxY);
                }

                // Only draw neurons in debug mode
                if (debugMode) {
                    drawNeurons();
                }

                requestAnimationFrame(updateAndDraw);
            }
            
            updateAndDraw();
        });
    </script>
</body>
</html>
